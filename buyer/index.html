<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Echo Market — Order aircraft</title>
    <meta name="description" content="Order aircraft for your Echo UA airline. Sign in with Discord, create your airline, send your order.">
    <link rel="icon" type="image/png" href="echo_logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="echo_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- Libraries are served from this site (copies in vendor/, pinned versions), so no outside server
         can change the code the page runs. The Content-Security-Policy in vercel.json only allows scripts
         from this site. -->
    <script src="vendor/tailwindcss-3.4.16.js"></script>
    <script src="vendor/react-18.3.1.min.js"></script>
    <script src="vendor/react-dom-18.3.1.min.js"></script>
    <script src="vendor/htm-3.1.1.js"></script>
    <script src="vendor/lucide-0.469.0.min.js"></script>
    <script src="vendor/supabase-js-2.117.2.js"></script>
    <!-- Public settings (Supabase URL + anon key) served from Vercel env vars by api/config.js -->
    <script src="/api/config"></script>

    <script src="js/theme.js"></script>
    <script src="js/tailwind-config.js"></script>
    <style type="text/tailwindcss">
        :root { color-scheme: dark; }
        /* Space backdrop: tiled stars (four tile sizes so the pattern does not look regular) + two faint nebula glows, fixed behind the content. */
        body {
            background-image:
                radial-gradient(1.5px 1.5px at 23px 41px, rgba(255,255,255,0.9), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 141px 97px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(2.5px 2.5px at 77px 173px, rgba(199,210,254,0.9), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 203px 211px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 61px 263px, rgba(255,255,255,0.5), rgba(0,0,0,0)),
                radial-gradient(3px 3px at 311px 59px, rgba(165,180,252,0.85), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 367px 301px, rgba(255,255,255,0.7), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 113px 17px, rgba(255,255,255,0.65), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 251px 143px, rgba(224,231,255,0.75), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 29px 389px, rgba(255,255,255,0.55), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 433px 227px, rgba(255,255,255,0.6), rgba(0,0,0,0)),
                radial-gradient(ellipse 60% 45% at 88% -8%, rgba(139,92,246,.14), transparent 70%),
                radial-gradient(ellipse 50% 40% at -5% 105%, rgba(168,85,247,.07), transparent 70%);
            background-size: 240px 240px, 240px 240px, 240px 240px, 240px 240px, 240px 240px,
                             420px 420px, 420px 420px,
                             330px 330px, 330px 330px, 510px 510px, 510px 510px, 100% 100%, 100% 100%;
            background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, repeat, no-repeat, no-repeat;
            background-attachment: fixed;
        }
        /* Faint purple aurora, same technique as the seller site.
           body::before and body::after are two layers of soft aurora clouds. They drift, stretch and
           tilt on different slow cycles (≈70s and ≈95s), so the combined glow slowly changes shape. */
        body::before, body::after { content: ""; position: fixed; z-index: -1; pointer-events: none; will-change: transform, opacity; }
        body::before {
            inset: -15% -20% 10% -20%;
            background:
                radial-gradient(ellipse 24% 40% at 16% 38%, rgba(124, 58, 237, .60), transparent 70%),
                radial-gradient(ellipse 22% 48% at 40% 30%, rgba(139, 92, 246, .62), transparent 70%),
                radial-gradient(ellipse 20% 38% at 63% 40%, rgba(168, 85, 247, .55), transparent 70%),
                radial-gradient(ellipse 22% 46% at 85% 32%, rgba(147, 51, 234, .50), transparent 70%);
            filter: blur(60px);
            opacity: .22;
            transform-origin: 30% 20%;
            animation: aurora-drift-a 70s ease-in-out infinite alternate;
        }
        body::after {
            inset: -10% -20% 20% -20%;
            background:
                radial-gradient(ellipse 34% 26% at 28% 52%, rgba(109, 40, 217, .45), transparent 72%),
                radial-gradient(ellipse 30% 30% at 58% 22%, rgba(196, 181, 253, .25), transparent 72%),
                radial-gradient(ellipse 36% 24% at 80% 55%, rgba(147, 51, 234, .40), transparent 72%);
            filter: blur(70px);
            opacity: .16;
            transform-origin: 70% 30%;
            animation: aurora-drift-b 95s ease-in-out infinite alternate;
        }
        @keyframes aurora-drift-a {
            0%   { transform: translate(-4%, 0) rotate(-3deg) scale(1, .92); }
            35%  { transform: translate(2%, 2%) rotate(1deg) scale(1.08, 1.06); }
            70%  { transform: translate(5%, -1%) rotate(4deg) scale(.96, 1.12); }
            100% { transform: translate(-1%, 3%) rotate(-1deg) scale(1.05, .98); }
        }
        @keyframes aurora-drift-b {
            0%   { transform: translate(5%, 2%) rotate(3deg) scale(1.06, 1); }
            40%  { transform: translate(-3%, -2%) rotate(-2deg) scale(.94, 1.1); }
            100% { transform: translate(-6%, 1%) rotate(-5deg) scale(1.1, .94); }
        }
        @media (prefers-reduced-motion: reduce) { body::before, body::after { animation: none; } }
        @media (max-width: 640px) { html { font-size: 14px; } }
        @supports (-webkit-touch-callout: none) { @media (max-width: 640px) { input, select, textarea { font-size: 16px !important; } } }
        body { @apply bg-page text-slate-100 font-sans antialiased; -webkit-tap-highlight-color: transparent; }
        @layer components {
        .card { @apply bg-slate-900/80 backdrop-blur-sm border border-slate-800 rounded-3xl transition-colors; }
        .label { @apply font-mono text-[10px] font-medium uppercase tracking-[0.16em]; }
        .field-label { @apply block text-xs font-bold text-slate-400 mb-1.5; }
        .input { @apply w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder:text-slate-600 outline-none focus:border-sky-400/70 focus:ring-2 focus:ring-sky-400/20; }
        .stepper { @apply w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-200 hover:bg-slate-700 shrink-0; }
        .menu-item { @apply flex items-center gap-2.5 px-3 py-2 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 hover:text-white; }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { scrollbar-width: none; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <noscript>Echo Market needs JavaScript enabled.</noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
