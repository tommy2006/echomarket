<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Echo winglet icons (scripts/make-favicons.py). Google asks for /favicon.ico first and needs >= 48 px squares. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/icon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>Echo Market — Order aircraft</title>
    <meta name="description" content="Order aircraft for your Echo UA airline. Sign in with Discord, create your airline, send your order.">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- Libraries are served from this site (copies in vendor/, pinned versions), so no outside server
         can change the code the page runs. The Content-Security-Policy in vercel.json only allows scripts
         from this site. -->
    <!-- Built ahead of time from styles/buyer.css by "npm run sync" (scripts/build-css.mjs). -->
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/echo-loader.css">
    <link rel="stylesheet" href="css/lang-menu.css">
    <!-- Scripts are deferred so the page (and the Echo loader) paints at once; our modules download in parallel. -->
    <link rel="modulepreload" href="js/app.js">
    <link rel="modulepreload" href="js/ui.js">
    <script defer src="vendor/react-18.3.1.min.js"></script>
    <script defer src="vendor/react-dom-18.3.1.min.js"></script>
    <script defer src="vendor/htm-3.1.1.js"></script>
    <script defer src="vendor/lucide-icons-58337501e1.js"></script>
    <script defer src="vendor/supabase-js-2.117.2.js"></script>
    <!-- Public settings (Supabase URL + anon key) served from Vercel env vars by api/config.js -->
    <script defer src="/api/config"></script>

</head>
<body>
    <!-- First paint: the Echo loader shows while the scripts load; React replaces it. -->
    <div id="root"><div class="echo-loading-screen" role="status" aria-live="polite"><span class="echo-loader" aria-hidden="true"></span><span class="echo-loader-text">Loading…</span></div></div>
    <noscript>Echo Market needs JavaScript enabled.</noscript>
    <script type="module" src="js/app.js"></script>
</body>
</html>
